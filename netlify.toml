# Static site, no build step. Netlify serves the repo root as is.
[build]
  publish = "."
  command = ""

# The weekly framework lands as a merge, so don't let browsers sit on an old list.
[[headers]]
  for = "/data/*"
  [headers.values]
    Cache-Control = "public, max-age=300, must-revalidate"

# Nothing in here is for visitors.
[[redirects]]
  from = "/scripts/*"
  to = "/404.html"
  status = 404
  force = true
