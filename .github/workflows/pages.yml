name: Deploy to GitHub Pages

# Publishes the repo root as the site. It runs on every push to main, and also after
# each framework-of-the-week run, because the bot merges with the default token and
# pushes made with that token don't trigger other workflows.
on:
  push:
    branches: [main]
  workflow_run:
    workflows: ['Framework of the week']
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
